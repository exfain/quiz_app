    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button { font: inherit; }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    .theme-background {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-color: var(--bg);
      background-image: var(--noise);
      background-repeat: repeat;
      background-size: 256px 256px;
      background-blend-mode: overlay;
      opacity: 0;
    }

    .stage.is-transitioning .theme-background {
      animation: background-in 720ms ease-in-out forwards;
    }

    .game-shell {
      position: absolute;
      inset: 6vh 4vw;
      z-index: 2;
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.05);
      background: var(--shell);
      box-shadow: 0 26px 72px rgba(0,0,0,.42);
      opacity: 0;
    }

    .stage.is-transitioning .game-shell {
      animation: shell-in 220ms ease-out 420ms forwards;
    }

    .game-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background-image: var(--noise);
      background-repeat: repeat;
      background-position: 0 0;
      background-size: 256px 256px;
      mix-blend-mode: overlay;
      opacity: 0;
    }

    .stage.is-transitioning .game-shell::after {
      animation: texture-in 520ms ease-out 520ms forwards;
    }

    .theme-bars {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .theme-bar {
      position: absolute;
      right: -30%;
      bottom: -30%;
      width: 145%;
      height: var(--h);
      background: var(--bar);
      transform-origin: center;
      transform: translate3d(72vw, 50vh, 0) rotate(-27deg);
      opacity: 0;
    }

    .theme-bar:nth-child(1) { --h: 5px;  bottom: 43%; }
    .theme-bar:nth-child(2) { --h: 10px; bottom: 37%; }
    .theme-bar:nth-child(3) { --h: 16px; bottom: 29%; }
    .theme-bar:nth-child(4) { --h: 23px; bottom: 19%; }
    .theme-bar:nth-child(5) { --h: 34px; bottom: 6%;  }

    .stage.is-transitioning .theme-bar {
      animation: bar-in 560ms cubic-bezier(.18,.72,.22,1) forwards;
    }

    .stage.is-transitioning .theme-bar:nth-child(1) { animation-delay: 560ms; }
    .stage.is-transitioning .theme-bar:nth-child(2) { animation-delay: 610ms; }
    .stage.is-transitioning .theme-bar:nth-child(3) { animation-delay: 660ms; }
    .stage.is-transitioning .theme-bar:nth-child(4) { animation-delay: 710ms; }
    .stage.is-transitioning .theme-bar:nth-child(5) { animation-delay: 760ms; }

    .intro {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: transparent;
    }

    .intro-copy {
      position: relative;
      display: grid;
      justify-items: center;
      width: min(92vw, 1100px);
      min-height: 260px;
      padding: 44px 20px;
    }

    .game-number-wrap {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      min-height: 34px;
      margin: 0 0 20px;
      opacity: 0;
    }

    .stage.is-primed .game-number-wrap {
      animation: number-wrap-in 120ms steps(2,end) 160ms forwards;
    }

    .game-number {
      grid-area: 1 / 1;
      position: relative;
      margin: 0;
      color: rgba(255,255,255,.82);
      font: 700 clamp(16px,2vw,24px)/1 "Courier New", monospace;
      letter-spacing: .22em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0;
      clip-path: inset(0 100% 0 0);
      transform: translateY(4px) scaleX(.76);
    }

    .game-number::before,
    .game-number::after {
      content: attr(data-label);
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
    }

    .game-number::before {
      color: rgba(255,45,45,.72);
      transform: translateX(-2px);
    }

    .game-number::after {
      color: rgba(60,120,255,.68);
      transform: translateX(2px);
    }

    .stage.is-primed .game-number {
      animation:
        number-build 420ms steps(5,end) 210ms forwards,
        number-settle 260ms ease-out 630ms forwards,
        number-main-flicker 90ms steps(2,end) 920ms 2;
    }

    .stage.is-primed .game-number::before {
      animation: number-red-blip 110ms steps(2,end) 880ms 1;
    }

    .stage.is-primed .game-number::after {
      animation: number-blue-blip 110ms steps(2,end) 900ms 1;
    }

    .interference {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 150px;
    }

    .text {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      opacity: 0;
    }

    .stage.is-running .text {
      opacity: 1;
      animation: jerkwhole 5s infinite;
    }

    .text span {
      grid-area: 1 / 1;
      position: relative;
      display: block;
      max-width: 100%;
      margin: 0;
      color: #fff;
      font: 700 clamp(52px,10vw,132px)/.88 "Courier New", monospace;
      letter-spacing: -.07em;
      text-align: center;
      text-transform: uppercase;
      white-space: normal;
      overflow-wrap: anywhere;
      user-select: none;
      pointer-events: none;
      opacity: 0;
    }

    .stage.is-running .text span {
      opacity: 1;
      animation: blur 30ms infinite, jerk 50ms infinite;
    }

    .text span:nth-child(1) {
      color: red;
      margin-left: -2px;
      filter: blur(2px);
    }

    .text span:nth-child(2) {
      color: green;
      margin-left: 2px;
      filter: blur(2px);
    }

    .stage.is-running .text span:nth-child(2) { animation: jerkgreen 1s infinite; }

    .text span:nth-child(3) {
      color: blue;
      filter: blur(1px);
    }

    .stage.is-running .text span:nth-child(3) { animation: jerkblue 1s infinite; }

    .text span:nth-child(4) {
      color: #fff;
      filter: blur(1px);
      text-shadow: 0 0 50px rgba(255,255,255,.4);
    }

    .text span:nth-child(5) {
      color: rgba(255,255,255,.4);
      filter: blur(15px);
    }

    .scanlines {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      grid-template-rows: repeat(11,4px);
      align-content: space-around;
      pointer-events: none;
      opacity: 0;
    }

    .stage.is-running .scanlines { opacity: 1; }

    .scanline {
      width: 100%;
      height: 4px;
      background: #000;
      opacity: .1;
    }

    .stage.is-transitioning .intro-copy {
      animation: intro-copy-out 480ms ease-in forwards;
    }

    .screen-content {
      position: relative;
      z-index: 4;
      height: 100%;
      padding: 34px 42px 36px;
      color: var(--paper);
    }

    .screen-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
    }

    .app-name,
    .rec-text,
    .waiting-copy,
    .screen-footer,
    .rec-dot {
      opacity: 0;
    }

    .app-name {
      font-size: 18px;
      font-weight: 1000;
      letter-spacing: .02em;
      transform: translateY(-12px);
    }

    .rec {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font: 700 11px/1.25 "Courier New", monospace;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .rec-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 9px rgba(207,99,56,.6);
      transform: scale(0);
    }

    .rec-text { transform: translateX(8px); }

    .waiting-copy {
      width: min(760px, 86%);
      padding-top: clamp(94px, 16vh, 158px);
      transform: translateY(18px);
    }

    .kicker {
      margin: 0 0 22px;
      color: var(--muted);
      font: 700 12px/1.2 "Courier New", monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .waiting-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: min(720px, 100%);
      min-height: 250px;
      padding: 30px 0 0;
    }

    .waiting-loader-slot {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      min-height: 84px;
      margin: 0 0 30px;
      color: var(--yellow);
    }

    .waiting-loader-slot .qa-start-waiting-animation {
      width: auto;
      min-height: 64px;
      margin: 0;
      justify-content: flex-start;
    }

    .waiting-loader-slot .qa-wait-loader-frame {
      justify-content: center;
    }

    .waiting-title {
      position: relative;
      z-index: 1;
      margin: 0;
      max-width: 720px;
      color: var(--paper);
      font-size: clamp(38px, 5.4vw, 68px);
      line-height: .94;
      font-weight: 1000;
      letter-spacing: -.045em;
      text-transform: uppercase;
    }

    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      white-space: nowrap;
    }

    .live-status__label {
      color: var(--paper);
    }

    .live-status__dot {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 7px rgba(207,99,56,.55);
    }

    .live-status__name {
      color: var(--muted);
    }

    .screen-footer {
      position: absolute;
      left: 42px;
      right: 42px;
      bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font: 700 11px/1.2 "Courier New", monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      transform: translateY(10px);
    }

    .timer {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .timer-track {
      width: min(32vw,260px);
      height: 5px;
      background: rgba(216,216,209,.18);
    }

    .timer-fill {
      display: block;
      width: 70%;
      height: 100%;
      background: var(--yellow);
    }

    .stage.is-transitioning .app-name {
      animation: element-in-up 360ms ease-out 1540ms forwards;
    }

    .stage.is-transitioning .rec-dot {
      animation: dot-pop 420ms cubic-bezier(.2,1.4,.4,1) 1320ms forwards;
    }

    .stage.is-transitioning .rec-text {
      animation: element-in-left 300ms ease-out 1620ms forwards;
    }

    .stage.is-transitioning .waiting-copy {
      animation: element-in-up 460ms ease-out 1780ms forwards;
    }

    .stage.is-transitioning .screen-footer {
      animation: element-in-up 360ms ease-out 2240ms forwards;
    }

.qa-wait-loader {
  color: var(--participant-effective-text-color, var(--participant-text-color, currentColor));
  box-sizing: border-box;
}

.qa-wait-loader:not([class*="qa-wait-loader-"]):not(.qa-arcade-wait-loader) {
  width: 40px;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 2px solid;
  position: relative;
  display: inline-block;
  flex: 0 0 auto;
  z-index: 1;
  transform-origin: left;
  animation: qa-wait-loader-spin 2s infinite linear;
}

.waiting-animation:has(.qa-wait-loader) {
  overflow: visible;
  display: flex;
  align-items: center;
  justify-content: center;
}

.waiting-animation .qa-wait-loader {
  color: currentColor;
  flex: 0 0 auto;

  <button class="replay" id="replay" type="button">Intro wiederholen</button>

  <script>
    (() => {
      const stage = document.getElementById('stage');
      const replay = document.getElementById('replay');
      const waitLoader = document.getElementById('waitLoader');
      const timers = [];
      const waitLoaderVariants = [
        '',
        'qa-wait-loader-01',
        'qa-wait-loader-03',
        'qa-wait-loader-04',
        'qa-wait-loader-05',
        'qa-wait-loader-06',
        'qa-wait-loader-07',
        'qa-wait-loader-08',
        'qa-wait-loader-09',
        'qa-wait-loader-10',
        'qa-wait-loader-11',
        'qa-wait-loader-12',
        'qa-wait-loader-14',
        'qa-wait-loader-15',
        'qa-wait-loader-16',
        'qa-wait-loader-17',
        'qa-wait-loader-18',
        'qa-wait-loader-19'
      ];

      function selectExistingWaitLoader() {
        waitLoader.className = 'qa-wait-loader';
        const variant = waitLoaderVariants[Math.floor(Math.random() * waitLoaderVariants.length)];
        if (variant) waitLoader.classList.add(variant);
      }

      function clearTimers() {
        while (timers.length) window.clearTimeout(timers.pop());
      }

      function later(fn, ms) {
        timers.push(window.setTimeout(fn, ms));
      }

      function play() {
        clearTimers();
        selectExistingWaitLoader();
        replay.classList.remove('is-visible');
        stage.classList.remove('is-primed', 'is-running', 'is-transitioning');
        void stage.offsetWidth;

        stage.classList.add('is-primed');

        later(() => {
          stage.classList.add('is-running');
        }, 1640);

        later(() => {
          stage.classList.add('is-transitioning');
        }, 6200);

        later(() => {
          replay.classList.add('is-visible');
        }, 9000);
      }

      replay.addEventListener('click', play);
      play();
    })();
  </script>
