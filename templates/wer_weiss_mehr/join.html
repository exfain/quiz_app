<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wer weiß mehr?</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 520px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h1 class="h3 mb-3">Wer weiß mehr?</h1>
            <div class="mb-3">
                <label class="form-label">Raumcode</label>
                <input class="form-control" id="roomCode" maxlength="4" inputmode="numeric">
            </div>
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input class="form-control" id="participantName">
            </div>
            <div class="alert alert-danger d-none" id="errorBox"></div>
            <button class="btn btn-primary w-100" id="joinBtn">Beitreten</button>
        </div>
    </div>
</main>
<script>
const errorBox = document.getElementById('errorBox');
document.getElementById('joinBtn').addEventListener('click', () => {
    const roomCode = document.getElementById('roomCode').value.trim();
    const participantName = document.getElementById('participantName').value.trim();
    errorBox.classList.add('d-none');
    fetch('/wer-weiss-mehr/join/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
        body: JSON.stringify({room_code: roomCode, participant_name: participantName}),
    })
    .then(response => response.json())
    .then(data => {
        if (!data.success) throw new Error(data.error || 'Beitritt fehlgeschlagen.');
        window.location.href = `/wer-weiss-mehr/play/${roomCode}/${encodeURIComponent(participantName)}/`;
    })
    .catch(error => {
        errorBox.textContent = error.message;
        errorBox.classList.remove('d-none');
    });
});
function getCookie(name) {
    return document.cookie.split(';').map(c => c.trim()).find(c => c.startsWith(name + '='))?.slice(name.length + 1) || '';
}
</script>
</body>
</html>
