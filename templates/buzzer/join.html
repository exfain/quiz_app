{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzzer beitreten</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 520px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h1 class="h4 mb-3">Buzzer beitreten</h1>
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="room_code">Room-Code</label>
                    <input class="form-control" id="room_code" name="room_code" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="participant_name">Name</label>
                    <input class="form-control" id="participant_name" name="participant_name" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Beitreten</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
