<script>
(function primeVhsIntroTransitionGate() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('game_start_intro') !== '1') return;
  const endsAt = Date.parse(params.get('game_start_intro_ends_at') || '');
  const receivedAt = Number(params.get('game_start_client_received_at'));
  const serverNow = Date.parse(params.get('game_start_server_now') || '');
  if (!Number.isFinite(endsAt) || !Number.isFinite(serverNow)) return;
  const estimatedNow = serverNow + (
    Number.isFinite(receivedAt) ? Math.max(0, Date.now() - receivedAt) : 0
  );
  const transitionDuration = window.matchMedia('(prefers-reduced-motion: reduce)').matches
    ? 480
    : 2800;
  if (estimatedNow >= endsAt + transitionDuration) return;
  document.documentElement.classList.add('is-session-game-intro-active');
  if (estimatedNow >= endsAt) {
    document.documentElement.classList.add('qa-vhs-transition--active');
    document.documentElement.style.setProperty(
      '--qa-vhs-transition-elapsed',
      `${Math.max(0, estimatedNow - endsAt)}ms`
    );
  }
  window.__qaVhsTransitionGateFallback = window.setTimeout(function () {
    document.documentElement.classList.remove(
      'is-session-game-intro-active',
      'qa-vhs-transition--active'
    );
    document.documentElement.style.removeProperty('--qa-vhs-transition-elapsed');
  }, 13000);
}());
</script>

<script>
function isQaVhsParticipantTheme() {
  const activeTheme = String(
    document.documentElement.dataset.participantTheme || ''
  ).trim();
  if (['standard', 'arcade', 'vhs'].includes(activeTheme)) {
    return activeTheme === 'vhs';
  }
  try {
    return window.localStorage.getItem('participant_interface_theme') === 'vhs';
  } catch (_) {
    return false;
  }
}

function initializeQaVhsGameIntro(options = {}) {
  const root = options.root instanceof Element
    ? options.root
    : document.querySelector('[data-qa-vhs-intro]');

  if (!root) return null;

  const rawGameNumber = options.gameNumber ?? root.dataset.gameNumber ?? '';
  const rawGameTitle = options.gameTitle ?? options.gameName ?? root.dataset.gameTitle ?? '';
  const rawGameId = options.gameId ?? root.dataset.gameId ?? `${rawGameNumber}:${rawGameTitle}`;
  const gameNumber = String(rawGameNumber).trim();
  const gameTitle = String(rawGameTitle).trim().toLocaleUpperCase('de-DE');
  const gameKey = String(rawGameId).trim();
  const elapsedMs = Math.max(0, Number(options.elapsedMs) || 0);

  if (!gameTitle) return null;

  const numberElement = root.querySelector('[data-qa-vhs-intro-number]');
  const layerElements = root.querySelectorAll('[data-qa-vhs-intro-layer]');
  const stackElement = root.querySelector('[data-qa-vhs-intro-title]');
  const scanlineContainer = root.querySelector('[data-qa-vhs-intro-scanlines]');

  if (!numberElement || layerElements.length !== 5 || !stackElement || !scanlineContainer) {
    return null;
  }

  const numberLabel = gameNumber ? `SPIEL ${gameNumber}` : 'SPIEL';
  numberElement.textContent = numberLabel;
  numberElement.dataset.label = numberLabel;
  layerElements.forEach(element => {
    element.textContent = gameTitle;
  });
  stackElement.setAttribute('aria-label', gameTitle);

  const normalizedLength = gameTitle.replace(/\s+/g, ' ').length;
  const interference = root.querySelector('[data-qa-vhs-intro-interference]');
  if (interference) {
    interference.classList.remove(
      'qa-vhs-intro__interference--long',
      'qa-vhs-intro__interference--very-long'
    );
    if (normalizedLength >= 23) {
      interference.classList.add('qa-vhs-intro__interference--very-long');
    } else if (normalizedLength >= 13) {
      interference.classList.add('qa-vhs-intro__interference--long');
    }
  }

  root.style.setProperty('--qa-vhs-intro-elapsed', `${elapsedMs}ms`);
  root.dataset.qaVhsIntroGameKey = gameKey;
  root.dataset.qaVhsIntroStateRevision = String(Number(options.stateRevision) || 0);
  root.dataset.qaVhsIntroInitialized = 'true';
  root.classList.remove('qa-vhs-intro--playing');
  void root.offsetWidth;
  root.classList.add('qa-vhs-intro--playing');

  return {
    root,
    gameKey,
    destroy() {
      root.classList.remove('qa-vhs-intro--playing');
      root.style.removeProperty('--qa-vhs-intro-elapsed');
      delete root.dataset.qaVhsIntroInitialized;
      delete root.dataset.qaVhsIntroGameKey;
      delete root.dataset.qaVhsIntroStateRevision;
    },
  };
}

(function () {
  const VHS_TRANSITION_DURATION_MS = 2800;
  const VHS_TRANSITION_REDUCED_DURATION_MS = 480;
  const VHS_TRANSITION_FALLBACK_BUFFER_MS = 600;
  const params = new URLSearchParams(window.location.search);
  const introOverlay = document.getElementById('sessionGameStartIntro');
  const initialReceivedAt = Number(params.get('game_start_client_received_at'));
  let introState = {
    introActive: params.get('game_start_intro') === '1',
    gameNumber: params.get('game_start_order') || '',
    gameTitle: params.get('game_start_title') || '',
    gameKey: params.get('game_start_key') || '',
    roomCode: params.get('game_start_room') || '',
    gameInstanceId: params.get('game_start_instance') || '',
    introStartedAt: params.get('game_start_intro_started_at') || '',
    introEndsAt: params.get('game_start_intro_ends_at') || '',
    serverNow: params.get('game_start_server_now') || '',
    stateRevision: Number(params.get('game_start_state_revision')),
  };
  let clockServerNowMs = Date.parse(introState.serverNow);
  let clockPerformanceMs = performance.now();
  if (Number.isFinite(initialReceivedAt) && Number.isFinite(clockServerNowMs)) {
    clockServerNowMs += Math.max(0, Date.now() - initialReceivedAt);
  }
  let highestIntroRevision = Number.isInteger(introState.stateRevision)
    ? introState.stateRevision
    : 0;
  let hideTimer = null;
  let transitionTimer = null;
  let transitionFallbackTimer = null;
  let transitionActive = false;
  let visible = false;
  let introCompleted = false;
  let vhsIntroController = null;

  const storageKey = [
    'session-game-start-intro',
    params.get('hub_session') || '',
    introState.gameInstanceId,
    introState.introStartedAt,
  ].join(':');

  function readIntroRecord() {
    try {
      const record = JSON.parse(sessionStorage.getItem(storageKey) || 'null');
      return record && typeof record === 'object' ? record : null;
    } catch (_) {
      return null;
    }
  }

  function markIntroCompleted() {
    try {
      sessionStorage.setItem(storageKey, JSON.stringify({
        completedAt: new Date().toISOString(),
        stateRevision: highestIntroRevision,
      }));
    } catch (_) {}
  }

  function estimatedServerNowMs() {
    if (!Number.isFinite(clockServerNowMs)) return NaN;
    return clockServerNowMs + Math.max(0, performance.now() - clockPerformanceMs);
  }

  function syncServerClock(serverNow) {
    const parsedServerNow = Date.parse(serverNow || '');
    if (!Number.isFinite(parsedServerNow)) return false;
    clockServerNowMs = parsedServerNow;
    clockPerformanceMs = performance.now();
    return true;
  }

  function hasValidIntroTimeline(state) {
    const startedAt = Date.parse(state.introStartedAt || '');
    const endsAt = Date.parse(state.introEndsAt || '');
    return Boolean(
      state.gameNumber
      && state.gameTitle
      && state.gameInstanceId
      && Number.isFinite(startedAt)
      && Number.isFinite(endsAt)
      && endsAt > startedAt
      && Number.isInteger(state.stateRevision)
      && state.stateRevision >= 1
      && Number.isFinite(estimatedServerNowMs())
    );
  }

  function removeIntroParams() {
    const cleanParams = new URLSearchParams(window.location.search);
    [
      'game_start_intro',
      'game_start_key',
      'game_start_room',
      'game_start_instance',
      'game_start_order',
      'game_start_title',
      'game_start_intro_started_at',
      'game_start_intro_ends_at',
      'game_start_server_now',
      'game_start_state_revision',
      'game_start_client_received_at',
    ].forEach(key => cleanParams.delete(key));
    const query = cleanParams.toString();
    const cleanUrl = `${window.location.pathname}${query ? `?${query}` : ''}${window.location.hash}`;
    window.history.replaceState(window.history.state, document.title, cleanUrl);
  }

  function clearVhsIntroState() {
    document.documentElement.classList.remove(
      'is-session-game-intro-active',
      'qa-vhs-transition--active'
    );
    document.documentElement.style.removeProperty('--qa-vhs-transition-elapsed');
    document.querySelectorAll('.vhs-theme-shell[data-qa-vhs-transition-inert]').forEach(shell => {
      if (shell.dataset.qaVhsTransitionInert === 'remove') {
        shell.removeAttribute('inert');
      }
      delete shell.dataset.qaVhsTransitionInert;
    });
    introOverlay?.classList.remove('qa-vhs-intro--transitioning');
    introOverlay?.removeAttribute('aria-hidden');
    if (window.__qaVhsTransitionGateFallback) {
      window.clearTimeout(window.__qaVhsTransitionGateFallback);
      window.__qaVhsTransitionGateFallback = null;
    }
    vhsIntroController?.destroy();
    vhsIntroController = null;
  }

  function completeSequence() {
    if (introCompleted) return;
    introCompleted = true;
    transitionActive = false;
    markIntroCompleted();
    removeIntroParams();
    if (hideTimer) window.clearTimeout(hideTimer);
    if (transitionTimer) window.clearTimeout(transitionTimer);
    if (transitionFallbackTimer) window.clearTimeout(transitionFallbackTimer);
    hideTimer = null;
    transitionTimer = null;
    transitionFallbackTimer = null;
    if (!introOverlay || !visible) {
      clearVhsIntroState();
      return;
    }
    visible = false;
    if (document.documentElement.dataset.participantTheme === 'vhs') {
      introOverlay.hidden = true;
      clearVhsIntroState();
      return;
    }
    clearVhsIntroState();
    introOverlay.classList.add('qa-vhs-intro--hiding');
    window.setTimeout(() => {
      introOverlay.hidden = true;
      introOverlay.classList.remove('qa-vhs-intro--hiding');
    }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 180);
  }

  function startVhsTransition(elapsedMs = 0) {
    if (!introOverlay || introCompleted) return;
    const transitionDuration = window.matchMedia('(prefers-reduced-motion: reduce)').matches
      ? VHS_TRANSITION_REDUCED_DURATION_MS
      : VHS_TRANSITION_DURATION_MS;
    const normalizedElapsed = Math.max(
      0,
      Math.min(transitionDuration, Number(elapsedMs) || 0)
    );
    if (
      document.documentElement.dataset.participantTheme !== 'vhs'
      || normalizedElapsed >= transitionDuration
    ) {
      completeSequence();
      return;
    }

    if (hideTimer) window.clearTimeout(hideTimer);
    if (transitionTimer) window.clearTimeout(transitionTimer);
    if (transitionFallbackTimer) window.clearTimeout(transitionFallbackTimer);
    hideTimer = null;
    const transitionWasActive = document.documentElement.classList.contains(
      'qa-vhs-transition--active'
    );
    transitionActive = true;
    visible = true;
    introOverlay.hidden = false;
    introOverlay.setAttribute('aria-hidden', 'true');
    introOverlay.classList.add('qa-vhs-intro--transitioning');
    document.querySelectorAll('.vhs-theme-shell').forEach(shell => {
      if (!shell.hasAttribute('data-qa-vhs-transition-inert')) {
        shell.dataset.qaVhsTransitionInert = shell.hasAttribute('inert') ? 'preserve' : 'remove';
      }
      shell.setAttribute('inert', '');
    });
    document.documentElement.style.setProperty(
      '--qa-vhs-transition-elapsed',
      `${normalizedElapsed}ms`
    );
    if (transitionWasActive) {
      // Recreate the CSS animations so a server-clock resync does not add the
      // previous local animation runtime to the new authoritative elapsed time.
      document.documentElement.classList.remove('qa-vhs-transition--active');
      void document.documentElement.offsetWidth;
    }
    document.documentElement.classList.add(
      'is-session-game-intro-active',
      'qa-vhs-transition--active'
    );

    const remainingMs = transitionDuration - normalizedElapsed;
    transitionTimer = window.setTimeout(completeSequence, remainingMs);
    transitionFallbackTimer = window.setTimeout(
      completeSequence,
      remainingMs + VHS_TRANSITION_FALLBACK_BUFFER_MS
    );
  }

  function show() {
    if (!introOverlay || introCompleted || !hasValidIntroTimeline(introState)) return;
    const startedAt = Date.parse(introState.introStartedAt);
    const endsAt = Date.parse(introState.introEndsAt);
    const serverNow = estimatedServerNowMs();
    if (serverNow >= endsAt) {
      startVhsTransition(serverNow - endsAt);
      return;
    }
    const remainingMs = endsAt - serverNow;

    const elapsedMs = Math.max(0, Math.min(endsAt - startedAt, serverNow - startedAt));
    introOverlay.dataset.gameId = introState.gameInstanceId;
    introOverlay.dataset.gameNumber = introState.gameNumber;
    introOverlay.dataset.gameTitle = introState.gameTitle;
    introOverlay.hidden = false;
    introOverlay.removeAttribute('aria-hidden');
    introOverlay.classList.remove('qa-vhs-intro--transitioning');
    introOverlay.classList.remove('qa-vhs-intro--hiding');
    document.documentElement.classList.add('is-session-game-intro-active');
    visible = true;

    if (isQaVhsParticipantTheme()) {
      vhsIntroController?.destroy();
      vhsIntroController = initializeQaVhsGameIntro({
        root: introOverlay,
        gameId: introState.gameInstanceId,
        gameNumber: introState.gameNumber,
        gameTitle: introState.gameTitle,
        introStartedAt: introState.introStartedAt,
        introEndsAt: introState.introEndsAt,
        serverNow: introState.serverNow,
        stateRevision: introState.stateRevision,
        introActive: introState.introActive,
        elapsedMs,
      });
    } else {
      const numberElement = introOverlay.querySelector('[data-qa-vhs-intro-number]');
      const mainLayer = introOverlay.querySelector('[data-qa-vhs-intro-layer="white"]');
      numberElement.textContent = `Spiel ${introState.gameNumber}`;
      mainLayer.textContent = introState.gameTitle;
    }

    if (hideTimer) window.clearTimeout(hideTimer);
    hideTimer = window.setTimeout(
      document.documentElement.dataset.participantTheme === 'vhs'
        ? () => startVhsTransition(0)
        : completeSequence,
      remainingMs
    );
  }

  function normalizeIntroState(payload) {
    if (!payload || typeof payload !== 'object') return null;
    const source = payload.intro && typeof payload.intro === 'object'
      ? payload.intro
      : payload;
    const hasIntroField = [
      'intro_active',
      'intro_started_at',
      'intro_ends_at',
      'introActive',
      'introStartedAt',
      'introEndsAt',
    ].some(key => Object.prototype.hasOwnProperty.call(source, key));
    if (!hasIntroField) return null;
    return {
      introActive: source.intro_active ?? source.introActive ?? false,
      gameNumber: String(source.game_number ?? source.gameNumber ?? introState.gameNumber ?? ''),
      gameTitle: String(source.game_title ?? source.gameTitle ?? introState.gameTitle ?? ''),
      gameKey: String(source.game_key ?? source.gameKey ?? introState.gameKey ?? ''),
      roomCode: String(source.room_code ?? source.roomCode ?? introState.roomCode ?? ''),
      gameInstanceId: String(
        source.game_instance_id
        ?? source.gameInstanceId
        ?? introState.gameInstanceId
        ?? ''
      ),
      introStartedAt: source.intro_started_at
        ?? source.introStartedAt
        ?? introState.introStartedAt
        ?? '',
      introEndsAt: source.intro_ends_at
        ?? source.introEndsAt
        ?? introState.introEndsAt
        ?? '',
      serverNow: source.server_now ?? source.serverNow ?? introState.serverNow ?? '',
      stateRevision: Number(source.state_revision ?? source.stateRevision),
    };
  }

  function handleState(payload) {
    const nextState = normalizeIntroState(payload);
    if (!nextState) return false;
    if (
      introState.gameInstanceId
      && nextState.gameInstanceId
      && nextState.gameInstanceId !== introState.gameInstanceId
    ) {
      return false;
    }
    if (!Number.isInteger(nextState.stateRevision) || nextState.stateRevision < highestIntroRevision) {
      return false;
    }
    if (introCompleted && nextState.stateRevision <= highestIntroRevision) {
      return false;
    }

    highestIntroRevision = nextState.stateRevision;
    introState = nextState;
    syncServerClock(nextState.serverNow);
    const endsAt = Date.parse(nextState.introEndsAt || '');
    if (!Number.isFinite(endsAt)) {
      completeSequence();
      return true;
    }
    if (estimatedServerNowMs() >= endsAt) {
      startVhsTransition(estimatedServerNowMs() - endsAt);
      return true;
    }
    show();
    return true;
  }

  window.sessionGameStartIntro = {
    hide: completeSequence,
    handleState,
    getState() {
      return {...introState, transitionActive};
    },
  };

  if (!hasValidIntroTimeline(introState)) {
    clearVhsIntroState();
    removeIntroParams();
    return;
  }
  if (readIntroRecord()?.completedAt) {
    introCompleted = true;
    clearVhsIntroState();
    removeIntroParams();
    return;
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', show, {once: true});
  } else {
    show();
  }
})();
</script>
