{% load static %}
{% if participant_options_menu %}
<!-- Participant Options Menu -->
<style>
  @font-face {
    font-family: "QA Arcade Heading";
    src: url("/static/fonts/ka1.ttf") format("truetype");
    font-style: normal;
    font-weight: 400;
    font-display: swap;
  }

  @font-face {
    font-family: "QA Arcade Text";
    src: url("/static/fonts/RETROTECH.ttf") format("truetype");
    font-style: normal;
    font-weight: 400;
    font-display: swap;
  }

  #participant-options-menu-root {
    --participant-options-surface: rgba(255, 255, 255, 0.96);
    --participant-options-text: #111827;
    --participant-options-muted: #4b5563;
    --participant-options-accent: #111827;
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 99999;
    font-family: var(--font-family-sans, system-ui, sans-serif);
  }

  #participant-options-menu-root,
  #participant-options-menu-root *,
  #participant-options-menu-root option {
    font-weight: 400 !important;
  }

  html {
    font-size: var(--participant-root-font-size, 16px);
  }

  html[data-participant-theme="standard"],
  html[data-participant-theme="arcade"] {
    --participant-theme-background: var(--app-background, #d0d6b4);
    --participant-theme-text: #000;
    --participant-accent-color: #a3a88d;
    --participant-accent-color-2: #f24b3d;
    --participant-options-surface: rgba(255, 255, 255, 0.96);
    --participant-options-text: #111827;
    --participant-options-muted: #4b5563;
    --participant-options-accent: #111827;
  }

  html[data-participant-theme="standard"] {
    --participant-heading-font: var(--font-family-game-title, "Cinematografica", system-ui, sans-serif);
    --participant-body-font: var(--font-family-sans, "Walkway Condensed", system-ui, sans-serif);
  }

  html[data-participant-theme="arcade"] {
    --participant-heading-font: "QA Arcade Heading", sans-serif;
    --participant-body-font: "QA Arcade Text", monospace;
    --font-family-game-title: var(--participant-heading-font);
    --font-family-sans: var(--participant-body-font);
    --arcade-scanline-color: rgba(0, 0, 0, 0.16);
    --arcade-scanline-highlight: rgba(255, 255, 255, 0.025);
    --arcade-scanline-spacing: 4px;
    --arcade-vignette-strength: rgba(0, 0, 0, 0.18);
  }

  body.quiz-play-page,
  body.estimation-play-page,
  body.where-play-page,
  body.who-that-play-page,
  body.assign-play-page,
  body.blackjack-play-page,
  body.who-play-page {
    color: #000;
    font-size: 1.5rem;
    font-family: var(--participant-body-font, var(--font-family-sans, "Walkway Condensed", system-ui, sans-serif));
  }

  html[data-participant-theme="arcade"] body,
  html[data-participant-theme="arcade"] button,
  html[data-participant-theme="arcade"] input,
  html[data-participant-theme="arcade"] select,
  html[data-participant-theme="arcade"] textarea,
  html[data-participant-theme="arcade"] table,
  html[data-participant-theme="arcade"] .btn,
  html[data-participant-theme="arcade"] .participant-name,
  html[data-participant-theme="arcade"] .session-game-number,
  html[data-participant-theme="arcade"] .qa-start-waiting-subtitle,
  html[data-participant-theme="arcade"] .qa-local-start-subtitle,
  html[data-participant-theme="arcade"] .wwm-start-subtitle,
  html[data-participant-theme="arcade"] .score-box,
  html[data-participant-theme="arcade"] .scorebox,
  html[data-participant-theme="arcade"] .score-history-box,
  html[data-participant-theme="arcade"] #participant-options-menu-root {
    font-family: var(--participant-body-font, "QA Arcade Text", monospace) !important;
  }

  .quiz-title,
  .qa-game-title-font {
    font-family: var(--participant-heading-font, var(--font-family-game-title, "Cinematografica", system-ui, sans-serif)) !important;
    color: var(--participant-theme-text, #000) !important;
    font-size: clamp(3.2rem, 8vw, 5.6rem) !important;
    font-weight: 400 !important;
    line-height: 0.9;
    overflow-wrap: anywhere;
  }

  html[data-participant-theme="arcade"] .session-game-start-intro__title,
  html[data-participant-theme="arcade"] .ended-card > h1,
  html[data-participant-theme="arcade"] .ended-card > h2,
  html[data-participant-theme="arcade"] .end-screen h1,
  html[data-participant-theme="arcade"] .end-screen h2 {
    font-family: var(--participant-heading-font, "QA Arcade Heading", sans-serif) !important;
  }

  .quiz-info,
  .wwm-header > div:first-child,
  .buzzer-card .text-start,
  .points-card .text-start,
  .game-card > .d-flex > div:first-child {
    text-align: center !important;
  }

  .quiz-header {
    padding: 0.45rem 0 0.2rem !important;
    background: transparent !important;
    border-bottom: 0 !important;
    box-shadow: none !important;
    position: relative !important;
    top: auto !important;
    z-index: 50;
  }

  .quiz-header .container {
    max-width: none;
  }

  .quiz-header .header-content {
    display: grid !important;
    grid-template-columns: minmax(2.5rem, 1fr) minmax(0, auto) minmax(2.5rem, 1fr);
    align-items: center;
    min-height: 0;
    column-gap: 0.5rem;
    row-gap: 0.16rem;
    justify-content: initial;
    position: relative;
  }

  .quiz-header .quiz-info {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    gap: 0.05rem;
    grid-column: 2;
    grid-row: 1;
    justify-self: center;
    min-width: 0;
    max-width: min(38rem, calc(100vw - 8rem));
    padding: 0.58rem 1.35rem 0.66rem;
    border: 2px solid var(--participant-theme-text, #000);
    border-radius: 999px;
    background: var(--participant-effective-accent-color, var(--participant-accent-color, #a3a88d));
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--participant-theme-text, #000) 18%, transparent);
    text-align: center !important;
  }

  .quiz-header .quiz-title {
    display: block;
    margin: 0 !important;
    font-size: clamp(1.75rem, 5.4vw, 3.05rem) !important;
    line-height: 0.9;
  }

  .quiz-header .participant-info {
    grid-column: 2;
    grid-row: 2;
    justify-self: center;
    position: static;
    display: block !important;
    width: auto;
    max-width: min(24rem, calc(100vw - 8rem));
    gap: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: var(--participant-theme-text, #000) !important;
    overflow: visible;
  }

  .quiz-header .participant-avatar {
    display: none !important;
  }

  .quiz-header .participant-details {
    display: block;
    min-width: 0;
    text-align: center;
  }

  .participant-name {
    display: block;
    color: var(--participant-theme-text, #000) !important;
    font-size: clamp(0.9rem, 1.55vw, 1.08rem) !important;
    font-weight: 700;
    line-height: 1.05;
    max-width: min(24rem, calc(100vw - 8rem));
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .session-game-number {
    display: block !important;
    width: 100%;
    font-size: clamp(1rem, 2.45vw, 1.42rem) !important;
    color: var(--participant-theme-text, #000) !important;
    line-height: 1.1;
    margin-top: 0.04rem !important;
  }

  .qa-start-waiting-subtitle,
  .qa-local-start-subtitle,
  .wwm-start-subtitle {
    font-family: var(--participant-body-font, var(--font-family-sans, "Walkway Condensed", system-ui, sans-serif)) !important;
    font-size: clamp(1.5rem, 3.8vw, 2.2rem) !important;
    color: var(--participant-theme-text, #000) !important;
    margin-top: 0.25rem !important;
  }

  .waiting-card,
  .question-card,
  .submitted-card,
  .ended-card,
  .correct-answer-card,
  .busted-card,
  .buzzer-card,
  .points-card,
  .game-card,
  .wwm-card {
    --participant-frame-color: var(--participant-theme-text, #000);
    --participant-frame-gap-color: var(--participant-theme-background, #d0d6b4);
    position: relative;
    background-color: var(--participant-theme-background, #d0d6b4) !important;
    background-image: none !important;
    border: 3px solid var(--participant-frame-color) !important;
    box-shadow:
      0 0 0 1px var(--participant-frame-gap-color),
      0 0 0 4px var(--participant-frame-color),
      0 0 0 5px var(--participant-frame-gap-color),
      0 0 0 8px var(--participant-frame-color) !important;
    color: var(--participant-theme-text, #111827) !important;
    overflow: hidden;
  }

  .waiting-card > *,
  .question-card > *,
  .submitted-card > *,
  .ended-card > *,
  .correct-answer-card > *,
  .busted-card > *,
  .buzzer-card > *,
  .points-card > *,
  .game-card > *,
  .wwm-card > * {
    position: relative;
    z-index: 1;
  }

  .waiting-card::before,
  .question-card::before,
  .submitted-card::before,
  .ended-card::before,
  .correct-answer-card::before,
  .busted-card::before,
  .buzzer-card::before,
  .points-card::before,
  .game-card::before,
  .wwm-card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: var(--app-noise-overlay, url("/static/neutral_transparent_noise_overlay_512.png"));
    background-repeat: repeat;
    opacity: .32;
  }

  body.quiz-play-page .question-header,
  body.assign-play-page .question-header,
  body.where-play-page .question-header,
  body.who-that-play-page .question-header,
  body.who-play-page .question-header,
  body.blackjack-play-page .question-header,
  .wwm-card .timer-box,
  .buzzer-card .status-pill,
  .points-card #gameArea .metric,
  .game-card #questionArea .metric {
    background: var(--participant-effective-accent-color, var(--participant-accent-color, #a3a88d));
    border-color: var(--participant-effective-text-color, var(--participant-theme-text, currentColor));
    color: var(--participant-effective-text-color, var(--participant-theme-text, currentColor));
  }

  body.quiz-play-page .question-header .question-number,
  body.assign-play-page .question-header .question-number,
  body.where-play-page .question-header .question-number,
  body.where-play-page .question-header .question-meta,
  body.where-play-page .question-header .question-meta *,
  body.who-that-play-page .question-header .question-number,
  body.who-that-play-page .question-header .question-meta,
  body.who-that-play-page .question-header .question-meta *,
  body.who-play-page .question-header .question-number,
  body.blackjack-play-page .question-header .question-number {
    color: inherit !important;
  }

  body.quiz-play-page .question-header .timer-circle:not(.warning):not(.danger),
  body.assign-play-page .question-header .timer-circle:not(.warning):not(.danger),
  body.where-play-page .question-header .timer-circle:not(.warning):not(.danger),
  body.who-that-play-page .question-header .timer-circle:not(.warning):not(.danger),
  body.who-play-page .question-header .timer-circle:not(.warning):not(.danger),
  body.blackjack-play-page .question-header .timer-circle:not(.warning):not(.danger) {
    border-color: currentColor;
    color: inherit;
  }

  .submit-answer,
  #logRoundBtn,
  .wwm-card #submitBtn,
  .game-card #submitBtn {
    width: auto !important;
    min-width: min(100%, 9rem);
    max-width: 100%;
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    margin-left: auto;
    margin-right: auto;
    padding: 0.72rem 1.35rem !important;
    border-color: var(--participant-effective-text-color, var(--participant-theme-text, currentColor)) !important;
    background: var(--participant-effective-accent-color, var(--participant-accent-color, #a3a88d)) !important;
    color: var(--participant-effective-text-color, var(--participant-theme-text, currentColor)) !important;
    box-shadow: none;
  }

  .submit-answer > svg,
  #logRoundBtn > svg,
  .wwm-card #submitBtn > svg,
  .game-card #submitBtn > svg {
    display: none !important;
  }

  html[data-participant-colors-applied="true"] {
    --bg-primary: var(--participant-effective-bg-color);
    --bg-secondary: var(--participant-effective-bg-color);
    --text-primary: var(--participant-effective-text-color);
    --text-secondary: var(--participant-effective-text-color);
    --text-muted: var(--participant-effective-text-color);
    --bs-body-bg: var(--participant-effective-bg-color);
    --bs-body-color: var(--participant-effective-text-color);
    --bs-secondary-color: var(--participant-effective-text-color);
    --bs-tertiary-color: var(--participant-effective-text-color);
  }

  html[data-participant-colors-applied="true"] body {
    background: var(--participant-effective-bg-color) !important;
    color: var(--participant-effective-text-color) !important;
  }

  html[data-participant-colors-applied="true"] body::before {
    opacity: .32;
  }

  html[data-participant-colors-applied="true"] .waiting-card,
  html[data-participant-colors-applied="true"] .question-card,
  html[data-participant-colors-applied="true"] .submitted-card,
  html[data-participant-colors-applied="true"] .ended-card,
  html[data-participant-colors-applied="true"] .correct-answer-card,
  html[data-participant-colors-applied="true"] .busted-card,
  html[data-participant-colors-applied="true"] .buzzer-card,
  html[data-participant-colors-applied="true"] .points-card,
  html[data-participant-colors-applied="true"] .game-card,
  html[data-participant-colors-applied="true"] .wwm-card {
    --participant-frame-color: var(--participant-effective-text-color);
    --participant-frame-gap-color: var(--participant-effective-bg-color);
    background-color: var(--participant-effective-bg-color) !important;
    background-image: none !important;
    border-color: var(--participant-frame-color) !important;
    color: var(--participant-effective-text-color) !important;
  }

  html[data-participant-colors-applied="true"] .quiz-header .participant-info {
    color: var(--participant-effective-text-color) !important;
  }

  html[data-participant-colors-applied="true"] .quiz-header .quiz-info {
    border-color: var(--participant-effective-text-color);
    background: var(--participant-effective-accent-color);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--participant-effective-text-color) 18%, transparent);
  }

  html[data-participant-colors-applied="true"] .quiz-title,
  html[data-participant-colors-applied="true"] .qa-game-title-font,
  html[data-participant-colors-applied="true"] .participant-name,
  html[data-participant-colors-applied="true"] .session-game-number,
  html[data-participant-colors-applied="true"] .qa-start-waiting-subtitle,
  html[data-participant-colors-applied="true"] .qa-local-start-subtitle,
  html[data-participant-colors-applied="true"] .wwm-start-subtitle {
    color: var(--participant-effective-text-color) !important;
  }

  html[data-participant-high-contrast="true"] body::before {
    opacity: 0;
  }

  html[data-participant-high-contrast="true"] .waiting-card,
  html[data-participant-high-contrast="true"] .question-card,
  html[data-participant-high-contrast="true"] .submitted-card,
  html[data-participant-high-contrast="true"] .ended-card,
  html[data-participant-high-contrast="true"] .correct-answer-card,
  html[data-participant-high-contrast="true"] .busted-card,
  html[data-participant-high-contrast="true"] .buzzer-card,
  html[data-participant-high-contrast="true"] .points-card,
  html[data-participant-high-contrast="true"] .game-card,
  html[data-participant-high-contrast="true"] .wwm-card {
    background-image: none !important;
  }

  html[data-participant-high-contrast="true"] .waiting-card::before,
  html[data-participant-high-contrast="true"] .question-card::before,
  html[data-participant-high-contrast="true"] .submitted-card::before,
  html[data-participant-high-contrast="true"] .ended-card::before,
  html[data-participant-high-contrast="true"] .correct-answer-card::before,
  html[data-participant-high-contrast="true"] .busted-card::before,
  html[data-participant-high-contrast="true"] .buzzer-card::before,
  html[data-participant-high-contrast="true"] .points-card::before,
  html[data-participant-high-contrast="true"] .game-card::before,
  html[data-participant-high-contrast="true"] .wwm-card::before {
    opacity: 0;
  }

  html[data-participant-theme="arcade"] body::before {
    background-image:
      radial-gradient(
        ellipse at center,
        transparent 60%,
        var(--arcade-vignette-strength) 100%
      ),
      repeating-linear-gradient(
        to bottom,
        var(--arcade-scanline-color) 0,
        var(--arcade-scanline-color) 1px,
        var(--arcade-scanline-highlight) 1px,
        transparent var(--arcade-scanline-spacing)
      ) !important;
    background-size: 100% 100%, 100% var(--arcade-scanline-spacing) !important;
    background-repeat: no-repeat, repeat !important;
    opacity: 1 !important;
    pointer-events: none;
    z-index: 99998;
  }

  html[data-participant-theme="arcade"] .waiting-card::before,
  html[data-participant-theme="arcade"] .question-card::before,
  html[data-participant-theme="arcade"] .submitted-card::before,
  html[data-participant-theme="arcade"] .ended-card::before,
  html[data-participant-theme="arcade"] .correct-answer-card::before,
  html[data-participant-theme="arcade"] .busted-card::before,
  html[data-participant-theme="arcade"] .buzzer-card::before,
  html[data-participant-theme="arcade"] .points-card::before,
  html[data-participant-theme="arcade"] .game-card::before,
  html[data-participant-theme="arcade"] .wwm-card::before {
    background-image: none !important;
    opacity: 0 !important;
  }

  html[data-participant-theme="arcade"][data-participant-high-contrast="true"] body::before {
    background-image: none !important;
    opacity: 0 !important;
  }

  html[data-participant-theme="arcade"] :where(
    .quiz-header .quiz-info,
    .waiting-card,
    .question-card,
    .submitted-card,
    .ended-card,
    .correct-answer-card,
    .busted-card,
    .buzzer-card,
    .points-card,
    .game-card,
    .wwm-card,
    .question-header,
    .answer-option,
    .ladder-row,
    .left-items,
    .drop-zones,
    .matched-panel,
    .draggable-item,
    .drop-zone,
    .dropped-item,
    .score-box,
    .scorebox,
    .score-history-box,
    .qa-score-widget__toggle,
    .qa-score-widget__panel,
    .table-responsive,
    .submit-answer,
    #logRoundBtn,
    .btn
  ) {
    --arcade-frame-color: var(--participant-effective-text-color, var(--participant-theme-text, #000));
    border-color: var(--arcade-frame-color) !important;
    border-radius: 0 !important;
    box-shadow:
      2px 0 0 var(--arcade-frame-color),
      -2px 0 0 var(--arcade-frame-color),
      0 2px 0 var(--arcade-frame-color),
      0 -2px 0 var(--arcade-frame-color) !important;
  }

  .qa-theme-button-shell {
    position: relative;
    display: inline-grid;
    max-width: 100%;
    isolation: isolate;
    vertical-align: middle;
  }

  .qa-theme-button-shell--block {
    display: grid;
    width: 100%;
  }

  .qa-theme-button-shell--centered {
    display: grid;
    width: max-content;
    margin-inline: auto;
  }

  .qa-theme-button-shell:has(> .qa-theme-button.d-none),
  .qa-theme-button-shell:has(> .qa-theme-button[hidden]) {
    display: none !important;
  }

  .qa-theme-button-shell > .qa-theme-button {
    grid-area: 1 / 1;
    max-width: 100%;
  }

  .qa-theme-button-shell > .qa-theme-button.mb-2 {
    margin-bottom: 0 !important;
  }

  .qa-theme-button-shell:has(> .qa-theme-button.mb-2) {
    margin-bottom: 0.5rem;
  }

  .qa-theme-button-shell > .qa-theme-button.m-3 {
    margin: 0 !important;
  }

  .qa-theme-button-shell:has(> .qa-theme-button.m-3) {
    margin: 1rem;
  }

  .qa-theme-button > .qa-theme-button__label,
  .qa-theme-button > :not(.qa-theme-button__label) {
    position: relative;
    z-index: 3;
  }

  html[data-participant-theme="standard"] {
    --participant-button-clicked-color: color-mix(
      in srgb,
      var(--participant-effective-accent-color, var(--participant-accent-color, #a3a88d)) 72%,
      var(--participant-effective-text-color, var(--participant-theme-text, #000)) 28%
    );
  }

  html[data-participant-theme="standard"] .qa-theme-button-shell::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 4px solid var(--participant-effective-text-color, var(--participant-theme-text, #000));
    border-radius: var(--qa-theme-button-radius, var(--border-radius-lg, 0.75rem));
    pointer-events: none;
    z-index: 5;
    --qa-theme-frame-depth: calc(var(--qa-theme-button-radius, var(--border-radius-lg, 0.75rem)) + 4px);
    -webkit-mask:
      linear-gradient(#000 0 0) top left / 0 var(--qa-theme-frame-depth) no-repeat,
      linear-gradient(#000 0 0) bottom left / 0 var(--qa-theme-frame-depth) no-repeat,
      linear-gradient(#000 0 0) top left / var(--qa-theme-frame-depth) 0 no-repeat,
      linear-gradient(#000 0 0) top right / var(--qa-theme-frame-depth) 0 no-repeat;
    mask:
      linear-gradient(#000 0 0) top left / 0 var(--qa-theme-frame-depth) no-repeat,
      linear-gradient(#000 0 0) bottom left / 0 var(--qa-theme-frame-depth) no-repeat,
      linear-gradient(#000 0 0) top left / var(--qa-theme-frame-depth) 0 no-repeat,
      linear-gradient(#000 0 0) top right / var(--qa-theme-frame-depth) 0 no-repeat;
    transition: -webkit-mask-size 0.34s ease, mask-size 0.34s ease;
  }

  html[data-participant-theme="standard"]
    .qa-theme-button-shell:not(:has(> .qa-theme-button:disabled))
    :is(.qa-theme-button:not([aria-disabled="true"]):not(.disabled)) {
    position: relative;
    isolation: isolate;
  }

  html[data-participant-theme="standard"]

/* ============================================================
   Arcade waiting-loader collection
   Exactly 10 theme-specific loaders
   ============================================================ */

.qa-arcade-wait-loader,
.qa-arcade-wait-loader::before,
.qa-arcade-wait-loader::after {
  box-sizing: border-box;
}

.qa-arcade-wait-loader {
  flex: 0 0 auto;
}

/* ------------------------------------------------------------
   Arcade Loader 01
   ------------------------------------------------------------ */

.qa-arcade-wait-loader-01 {
  width: 45px;
  height: 30px;
  animation: qa-arcade-loader-01 2s infinite linear;
}

@keyframes qa-arcade-loader-01 {
  0%,
  25% {
    background:
      linear-gradient(#e50021 0 0)
      50% 0 / 66% 100% no-repeat;
  }

  25.1%,
  50% {
    background:
      linear-gradient(#004ce4 0 0)
      0 0 / 100% 50% no-repeat,
      linear-gradient(#004ce4 0 0)
      0 0 / 33% 100% no-repeat;
  }

  50.1%,
  75% {
    background:
      linear-gradient(#00e622 0 0)
      100% 0 / 66% 50% no-repeat,
      linear-gradient(#00e622 0 0)
      0 100% / 66% 50% no-repeat;
  }

  75.1%,
  100% {
    background:
      linear-gradient(#9d0be6 0 0)
      0 100% / 100% 50% no-repeat,
      linear-gradient(#9d0be6 0 0)
      50% 0 / 33% 50% no-repeat;
  }
}

/* ------------------------------------------------------------
   Arcade Loader 02
   ------------------------------------------------------------ */

.qa-arcade-wait-loader-02 {
  width: 45px;
  height: 30px;
  background:
    linear-gradient(#004ce4 0 0) 0 100% / 100% 50%,
    linear-gradient(#004ce4 0 0) 0 0 / calc(100% / 3) 100%;
  background-repeat: no-repeat;
  position: relative;
  clip-path: inset(-100% 0 0 0);
  animation: qa-arcade-loader-02-main 2s infinite steps(4);
}

.qa-arcade-wait-loader-02::before,
.qa-arcade-wait-loader-02::after {
  content: "";
  position: absolute;
  inset: -50% 0 50%;
  background:
    linear-gradient(#00e622 0 0)
    0 0 / calc(2 * 100% / 3) 50%,
    linear-gradient(#00e622 0 0)
    100% 100% / calc(2 * 100% / 3) 50%;
  background-repeat: no-repeat;
  animation: inherit;
  animation-name: qa-arcade-loader-02-before;
}

.qa-arcade-wait-loader-02::after {
  inset: -100% 0 100%;
  background:
    linear-gradient(#e50021 0 0)
    0 0 / 100% 50%,
    linear-gradient(#e50021 0 0)
    100% 0 / calc(100% / 3) 100%;
  background-repeat: no-repeat;
  animation-name: qa-arcade-loader-02-after;
}

@keyframes qa-arcade-loader-02-main {
  0% {
    transform: translateY(-250%);
    clip-path: inset(100% 0 0 0);
  }

  25%,
  100% {
    transform: translateY(0);
    clip-path: inset(-100% 0 0 0);
  }
}

@keyframes qa-arcade-loader-02-before {
  0%,
  25% {
    transform: translateY(-250%);
  }

  50%,
  100% {
    transform: translateY(0);
  }
}

@keyframes qa-arcade-loader-02-after {
  0%,
  50% {
    transform: translateY(-250%);
  }

  75%,
  100% {
    transform: translateY(0);
  }
}

/* ------------------------------------------------------------
   Arcade Loader 03
   ------------------------------------------------------------ */

.qa-arcade-wait-loader-03 {
  width: 80px;
  height: 70px;
  border: 5px solid #000;
  padding: 0 8px;
  background:
    linear-gradient(#fff 0 0) 0 0 / 8px 20px,
    linear-gradient(#fff 0 0) 100% 0 / 8px 20px,
    radial-gradient(farthest-side, #fff 90%, #0000)
    0 5px / 8px 8px content-box,
    #000;
  background-repeat: no-repeat;
  animation: qa-arcade-loader-03 2s infinite linear;
}

@keyframes qa-arcade-loader-03 {
  25% {
    background-position:
      0 0,
      100% 100%,
      100% calc(100% - 5px);
  }

  50% {
    background-position:
      0 100%,
      100% 100%,
      0 calc(100% - 5px);
  }

  75% {
    background-position:
      0 100%,
      100% 0,
      100% 5px;
  }
}

/* ------------------------------------------------------------
   Arcade Loader 04
   ------------------------------------------------------------ */

.qa-arcade-wait-loader-04 {
  width: 50px;
  aspect-ratio: 1;
  border-radius: 50%;
  background:
    radial-gradient(farthest-side, #000 98%, #0000)
    55% 20% / 8px 8px no-repeat,
    #ffcc00;
  box-shadow:
    2px -6px 12px 0 inset rgba(0, 0, 0, 0.7);
  animation:
    qa-arcade-loader-04 0.5s infinite steps(5) alternate;
}

@keyframes qa-arcade-loader-04 {
  0% {
    clip-path:
      polygon(
        50% 50%,
        100% 0,
        100% 0,
        0 0,
        0 100%,
        100% 100%,
        100% 100%
      );
  }

  100% {
    clip-path:
      polygon(
        50% 50%,
        100% 65%,
        100% 0,
        0 0,
        0 100%,
        100% 100%,
        100% 35%
      );
  }
}

/* ------------------------------------------------------------

   ------------------------------------------------------------ */

(function () {
  var LS_THEME = 'participant_interface_theme';
  var DEFAULT_THEME = 'standard';
  var ARCADE_THEME = 'arcade';
  var VHS_THEME = 'vhs';
  var standardLoaderVariants = [
    '',
    'qa-wait-loader-01',
    'qa-wait-loader-03',
    'qa-wait-loader-04',
    'qa-wait-loader-05',
    'qa-wait-loader-06',
    'qa-wait-loader-07',
    'qa-wait-loader-08',
    'qa-wait-loader-09',
    'qa-wait-loader-10',
    'qa-wait-loader-11',
    'qa-wait-loader-12',
    'qa-wait-loader-14',
    'qa-wait-loader-15',
    'qa-wait-loader-16',
    'qa-wait-loader-17',
    'qa-wait-loader-18',
    'qa-wait-loader-19'
  ];
  var arcadeLoaderVariants = [
    'qa-arcade-wait-loader-01',
    'qa-arcade-wait-loader-02',
    'qa-arcade-wait-loader-03',
    'qa-arcade-wait-loader-04',
    'qa-arcade-wait-loader-05',
    'qa-arcade-wait-loader-06',
    'qa-arcade-wait-loader-07',
    'qa-arcade-wait-loader-08',
    'qa-arcade-wait-loader-09',
    'qa-arcade-wait-loader-10'
  ];
  var waitLoaderSelector = '.qa-wait-loader, .qa-arcade-wait-loader';

  function readStoredTheme() {
    try {
      return window.localStorage.getItem(LS_THEME);
    } catch (error) {
      return null;
    }
  }

  function getActiveTheme() {
    var datasetTheme = document.documentElement.dataset.participantTheme;
    var storedTheme = readStoredTheme();
    if ([DEFAULT_THEME, ARCADE_THEME, VHS_THEME].indexOf(datasetTheme) !== -1) return datasetTheme;
    return [ARCADE_THEME, VHS_THEME].indexOf(storedTheme) !== -1 ? storedTheme : DEFAULT_THEME;
  }

  function clearWaitLoaderVariantClasses(loader) {
    Array.from(loader.classList).forEach(function (className) {
      var isLayoutClass = className === 'qa-wait-loader-stage' || className === 'qa-wait-loader-frame';
      if (
        !isLayoutClass
        && (
          className.startsWith('qa-wait-loader-')
          || className.startsWith('qa-arcade-wait-loader-')
          || className.startsWith('qa-hypnotic-loader-')
          || className.startsWith('qa-hypnotic-wait-loader-')
        )
      ) {
        loader.classList.remove(className);
      }
    });
    loader.classList.remove('qa-wait-loader', 'qa-arcade-wait-loader', 'loader');
  }

  function applyRandomLoaderVariant(loader, force) {
    if (!loader || loader.nodeType !== 1 || !loader.matches(waitLoaderSelector)) return;
    var activeTheme = getActiveTheme();
    if (
      !force
      && loader.dataset.qaWaitLoaderVariantApplied === 'true'
      && loader.dataset.qaWaitLoaderTheme === activeTheme
    ) {
      return;
    }

    clearWaitLoaderVariantClasses(loader);

    if (activeTheme === ARCADE_THEME) {
      var arcadeVariant = arcadeLoaderVariants[Math.floor(Math.random() * arcadeLoaderVariants.length)];
      loader.classList.add('qa-arcade-wait-loader', arcadeVariant);
    } else {
      var standardVariant = standardLoaderVariants[Math.floor(Math.random() * standardLoaderVariants.length)];
      loader.classList.add('qa-wait-loader');
      if (standardVariant) loader.classList.add(standardVariant);
    }

    loader.dataset.qaWaitLoaderTheme = activeTheme;
    loader.dataset.qaWaitLoaderVariantApplied = 'true';
  }

  function applyRandomLoaderVariants(root, force) {
    if (!root || root.nodeType !== 1) return;
    applyRandomLoaderVariant(root, force);
    root.querySelectorAll(waitLoaderSelector).forEach(function (loader) {
      applyRandomLoaderVariant(loader, force);
    });
  }

  function refreshWaitLoaders() {
    applyRandomLoaderVariants(document.body, true);
  }

  window.qaParticipantWaitLoaders = {
    applyAll: refreshWaitLoaders
  };

  function initRandomWaitLoaders() {
    applyRandomLoaderVariants(document.body, false);
    if (!('MutationObserver' in window)) return;
    new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        mutation.addedNodes.forEach(function (node) {
          applyRandomLoaderVariants(node, false);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initRandomWaitLoaders, { once: true });
  } else {
    initRandomWaitLoaders();
  }
}());
</script>

  var vhsRemovedEndscreenNodes = [];
  var vhsRemovedLobbyHeading = null;
  var actionThemeClickTimers = new WeakMap();
  var themeButtonSelector = 'button.btn, button.submit-answer, button.buzzer-button, button.tut-btn, .answer-option';

    '.drop-zone',
    '.ladder-row',

    '.triangle-container',
    '.answer-card'
  ].join(', ');

  function getStoredValue(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (error) {
      return null;
    }
  }

  function setStoredValue(key, value) {
    try {
      window.localStorage.setItem(key, value);
    } catch (error) {
      return;
    }
  }

  function removeStoredValue(key) {
    try {
      window.localStorage.removeItem(key);
    } catch (error) {
      return;
    }
  }

  function readStoredBoolean(key) {
    return getStoredValue(key) === '1';
  }

  function setStoredBoolean(key, value) {
    setStoredValue(key, value ? '1' : '0');
  }

  function normalizeHexColor(value, fallback) {
    var normalized = String(value || '').trim().toLowerCase();
    if (/^#[0-9a-f]{6}$/.test(normalized)) return normalized;
    return fallback;
  }

  function invertHexColor(value) {
    var normalized = normalizeHexColor(value, DEFAULT_BACKGROUND_COLOR);
    var raw = normalized.slice(1);
    var inverted = raw.match(/.{2}/g).map(function (part) {
      return (255 - parseInt(part, 16)).toString(16).padStart(2, '0');
    }).join('');
    return '#' + inverted;
  }

  function getThemeColor(variableName, fallback) {
    var value = window.getComputedStyle(document.documentElement).getPropertyValue(variableName);
    return normalizeHexColor(value, fallback);
  }

  function clampFontScale(value) {
    return Math.min(MAX_FONT_SCALE, Math.max(MIN_FONT_SCALE, value));
  }

  function readFontScale() {
    var stored = parseFloat(getStoredValue(LS_FONT_SCALE));
    if (!Number.isFinite(stored)) return DEFAULT_FONT_SCALE;
    return clampFontScale(stored);
  }

  function applyFontScale(scale) {
    var normalized = clampFontScale(scale);
    document.documentElement.style.setProperty('--participant-font-scale', normalized.toFixed(2));
    document.documentElement.style.setProperty('--participant-root-font-size', (16 * normalized).toFixed(2) + 'px');
    if (fontValue) fontValue.textContent = Math.round(normalized * 100) + ' %';
    return normalized;
  }

  function saveFontScale(scale) {
    var normalized = applyFontScale(scale);
    setStoredValue(LS_FONT_SCALE, normalized.toFixed(2));
  }

  function readTheme() {
    var stored = getStoredValue(LS_THEME);
    return THEMES.indexOf(stored) === -1 ? DEFAULT_THEME : stored;
  }

  function isVhsElementVisible(element) {
    return !!element
      && !element.hidden
      && !element.closest('.d-none, [hidden]');
  }

  function setVhsText(element, value) {
    if (element && element.textContent !== value) element.textContent = value;
  }

  function setReversibleVhsText(element, value) {
    if (!element) return;
    if (!Object.prototype.hasOwnProperty.call(element.dataset, 'vhsOriginalText')) {
      element.dataset.vhsOriginalText = element.textContent;
    }
    setVhsText(element, value);
  }

  function detachVhsEndscreenNode(element) {
    if (!element || !element.parentNode) return;
    var placeholder = document.createComment('vhs-endscreen-node');
    element.parentNode.replaceChild(placeholder, element);
    vhsRemovedEndscreenNodes.push({element: element, placeholder: placeholder});
  }

  function restoreVhsEndscreen() {
    document.querySelectorAll('[data-vhs-endscreen-original-html]').forEach(function (element) {
      element.innerHTML = element.dataset.vhsEndscreenOriginalHtml;

    });

    });
    vhsRemovedEndscreenNodes = [];

  function formatVhsRevealAnswer(value, questionType) {
    var text = String(value == null ? '' : value).trim();
    var normalizedType = String(questionType || '').trim().toLowerCase();
    var normalizedValue = text.toLowerCase();
    var isTrueFalse = ['true_false', 'true-false', 'boolean', 'bool'].includes(normalizedType);
    if (isTrueFalse && (normalizedValue === 'true' || normalizedValue === '1')) return 'Stimmt';
    if (isTrueFalse && (normalizedValue === 'false' || normalizedValue === '0')) return 'Stimmt nicht';

      .replace(/\s*\|\s*/g, ' · ')

  function formatVhsTimer(seconds) {
    var wholeSeconds = Math.max(0, Math.ceil(seconds));
    var hours = Math.floor(wholeSeconds / 3600);
    var minutes = Math.floor((wholeSeconds % 3600) / 60);
    var remainingSeconds = wholeSeconds % 60;
    return [hours, minutes, remainingSeconds].map(function (part) {
      return String(part).padStart(2, '0');
    }).join(':');
  }

  function parseVhsTimerValue(value) {
    var normalized = String(value || '').trim();
    if (!normalized) return null;
    if (normalized.indexOf(':') !== -1) {
      var parts = normalized.split(':').map(Number);
      if (parts.some(Number.isNaN)) return null;
      return parts.reduce(function (total, part) { return total * 60 + part; }, 0);
    }
    var match = normalized.match(/-?\d+(?:\.\d+)?/);
    return match ? Math.max(0, Number(match[0])) : null;
  }

  function syncVhsQuestion(shell, gameMeta) {
    var question = getVisibleVhsElement([
      '#questionState #questionText',
      '#questionState .question-text',
      '#questionArea .question-text',
      '#questionArea [data-question-text]',
      '.game-state:not(.d-none) .question-text'
    ].join(', '));
    shell.querySelectorAll('.vhs-question-kicker').forEach(function (kicker) {
      setVhsText(kicker, gameMeta);
    });
    if (!question || question.querySelector(':scope > .vhs-question-lead')) return;

    var originalQuestion = question.textContent;
    var fullQuestion = originalQuestion.replace(/\s+/g, ' ').trim();
    if (!fullQuestion) return;
    question.dataset.vhsFullQuestion = originalQuestion;

    var firstWhitespace = fullQuestion.search(/\s/);
    var firstWord = firstWhitespace === -1 ? fullQuestion : fullQuestion.slice(0, firstWhitespace);
    var remainingQuestion = firstWhitespace === -1 ? '' : fullQuestion.slice(firstWhitespace).trimStart();
    var lead = document.createElement('span');
    lead.className = 'vhs-question-lead';
    lead.textContent = firstWord.toLocaleUpperCase('de-DE');
    var body = document.createElement('span');
    body.className = 'vhs-question-body';
    body.textContent = remainingQuestion;
    question.replaceChildren(lead, body);

    var questionContent = question.closest('.question-content');
    if (questionContent && !questionContent.querySelector(':scope > .vhs-question-kicker')) {
      var kicker = document.createElement('p');
      kicker.className = 'vhs-question-kicker';
      kicker.textContent = gameMeta;
      questionContent.insertBefore(kicker, question);
    }
  }

  function syncVhsScoreWidget(shell) {
    var widget = ensureScoreWidget();
    if (!widget) return;
    var shortAnswerResponse = Array.from(shell.querySelectorAll('.quick-quiz-response-area'))
      .find(function (response) {
        return isVhsElementVisible(response) && response.querySelector('.quick-quiz-short-answer-form');

      .find(isVhsElementVisible);
    var assignResponse = Array.from(shell.querySelectorAll('#questionState .assign-workspace'))
      .find(isVhsElementVisible);
    var revealState = Array.from(shell.querySelectorAll('#correctAnswerState'))
      .find(isVhsElementVisible);
    if (shortAnswerResponse) {
      if (widget.parentNode !== shortAnswerResponse.parentNode || widget.nextSibling !== shortAnswerResponse) {
        shortAnswerResponse.parentNode.insertBefore(widget, shortAnswerResponse);
      }
    } else if (estimationResponse) {
      if (widget.parentNode !== estimationResponse.parentNode || widget.nextSibling !== estimationResponse) {
        estimationResponse.parentNode.insertBefore(widget, estimationResponse);
      }
    } else if (assignResponse) {
      if (widget.parentNode !== assignResponse.parentNode || widget.nextSibling !== assignResponse) {
        assignResponse.parentNode.insertBefore(widget, assignResponse);
      }
    } else if (revealState) {
      if (widget.parentNode !== revealState.parentNode || widget.nextSibling !== revealState) {
        revealState.parentNode.insertBefore(widget, revealState);
      }
    } else if (widget.parentNode !== shell) {
      shell.insertBefore(widget, shell.querySelector('.vhs-theme-footer'));
    }
    if (scoreWidgetButton) setVhsText(scoreWidgetButton, 'P');
    if (scorePositionSelect) scorePositionSelect.disabled = true;
    if (scorePositionVhsHint) scorePositionVhsHint.hidden = false;

    var panel = widget.querySelector('.qa-score-widget__body');
    if (panel) panel.classList.add('vhs-points-panel');
    if (panel && !panel.querySelector(':scope > .vhs-score-title')) {
      var title = document.createElement('p');
      title.className = 'vhs-score-title vhs-points-panel-title';
      title.textContent = 'PUNKTE PRO RUNDE';
      panel.prepend(title);
    }
    var list = widget.querySelector('.score-box__list');
    if (!list) return;
    list.classList.add('vhs-points-list');
    var rows = Array.from(list.querySelectorAll('.score-box__row'));
    rows.forEach(function (row) {
      row.classList.add('vhs-points-row');
      var round = row.querySelector('.score-box__badge');
      var value = row.querySelector('.score-box__value');
      if (round) {
        round.classList.add('vhs-points-round');
        if (round.dataset.vhsRoundNumber) setReversibleVhsText(round, round.dataset.vhsRoundNumber);
      }
      if (value) {
        value.classList.add('vhs-points-value');
        if (!Object.prototype.hasOwnProperty.call(value.dataset, 'vhsOriginalHtml')) {
          value.dataset.vhsOriginalHtml = value.innerHTML;
        }
        var rawMaxPoints = row.dataset.maxPoints;
        var rawEarnedPoints = row.dataset.pointsEarned;
        var maxPoints = rawMaxPoints === undefined || rawMaxPoints === '' ? null : Number(rawMaxPoints);
        var earnedPoints = rawEarnedPoints === undefined || rawEarnedPoints === '' ? null : Number(rawEarnedPoints);
        var existingText = value.textContent.trim();
        var isPending = rawEarnedPoints === ''
          || row.classList.contains('is-upcoming')
          || row.classList.contains('is-pending')
          || Boolean(value.querySelector('.score-box__empty'));
        if (!Number.isFinite(maxPoints) || maxPoints <= 0) {
          var existingScore = existingText.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
          if (existingScore) {
            earnedPoints = Number(existingScore[1]);
            maxPoints = Number(existingScore[2]);
          }
          var existingPendingScore = existingText.match(/^_+\s*\/\s*(\d+(?:\.\d+)?)$/);
          if (existingPendingScore) {
            maxPoints = Number(existingPendingScore[1]);
            isPending = true;
          }
        }
        var hasKnownMaxPoints = Number.isFinite(maxPoints) && maxPoints > 0;
        if (hasKnownMaxPoints || Number.isFinite(earnedPoints) || isPending) {
          var fractionText = (Number.isFinite(earnedPoints) ? earnedPoints : '_')
            + '/'
            + (hasKnownMaxPoints ? maxPoints : '_');
          var existingFraction = value.querySelector(':scope > .vhs-points-fraction');
          var existingUnit = value.querySelector(':scope > .vhs-points-unit');
          if (!existingFraction || !existingUnit || existingFraction.textContent !== fractionText) {
            var fraction = document.createElement('span');
            fraction.className = 'vhs-points-fraction';
            fraction.textContent = fractionText;
            var unit = document.createElement('span');
            unit.className = 'vhs-points-unit';
            unit.textContent = 'P';
            value.replaceChildren(fraction, unit);
          }
        }
      }
    });
    var roundCount = rows.length;
    var columnCount = roundCount <= 3 ? 1 : (roundCount <= 6 ? 2 : 3);
    var rowCount = Math.max(1, Math.ceil(roundCount / columnCount));
    list.style.setProperty('--vhs-score-columns', columnCount);
    list.style.setProperty('--vhs-score-rows', rowCount);
    var existingColumns = Array.from(list.querySelectorAll(':scope > .vhs-points-column'));
    var columnsAreCurrent = existingColumns.length === columnCount
      && existingColumns.every(function (column, columnIndex) {
        var expectedRows = rows.slice(columnIndex * rowCount, Math.min((columnIndex + 1) * rowCount, roundCount));
        return expectedRows.length === column.children.length
          && expectedRows.every(function (row, rowIndex) { return column.children[rowIndex] === row; });
      });
    if (!columnsAreCurrent && roundCount) {
      var fragment = document.createDocumentFragment();
      for (var columnIndex = 0; columnIndex < columnCount; columnIndex += 1) {
        var column = document.createElement('div');
        column.className = 'vhs-points-column';
        rows.slice(columnIndex * rowCount, Math.min((columnIndex + 1) * rowCount, roundCount)).forEach(function (row) {
          column.appendChild(row);
        });
        fragment.appendChild(column);
      }
      list.replaceChildren(fragment);
    }
  }

  function syncVhsPresentation() {
    if (!vhsThemeShell || document.documentElement.dataset.participantTheme !== 'vhs') return;
    var shell = vhsThemeShell;
    var title = shell.querySelector('.quiz-title, .qa-game-title-font, .game-title');
    var gameNumber = shell.querySelector('.session-game-number');
    var gameTitleText = title ? title.textContent.replace(/\s+/g, ' ').trim().toLocaleUpperCase('de-DE') : '';
    var gameNumberText = gameNumber ? gameNumber.textContent.replace(/\s+/g, ' ').trim().toLocaleUpperCase('de-DE') : '';
    var gameMeta = [gameTitleText, gameNumberText].filter(Boolean).join(' · ');
    syncVhsScoreWidget(shell);
    syncVhsLobby(shell);

    var currentQuestion = getVisibleVhsElement('#currentQuestionNumber, [data-current-question-number]');
    var currentQuestionText = currentQuestion
      ? (currentQuestion.dataset.currentQuestionNumber || currentQuestion.textContent).trim()
      : '';
    var scoreRows = shell.querySelectorAll('.score-box__row').length;
    var recText = shell.querySelector('.vhs-theme-rec-text');
    if (recText) {
      var currentNumber = parseInt(currentQuestionText, 10);
      setVhsText(recText, Number.isFinite(currentNumber) && scoreRows > 0
        ? 'REC · FRAGE ' + String(currentNumber).padStart(2, '0') + ' / ' + String(scoreRows).padStart(2, '0')
        : 'REC · LIVE');
    }

    var participantName = shell.querySelector('.participant-name, [data-participant-name]');
    var participantNameText = participantName
      ? (participantName.dataset.participantName || participantName.textContent).trim()
      : '';
    var participantDisplay = shell.querySelector('.vhs-theme-participant');
    if (participantDisplay) {
      setVhsText(participantDisplay, participantNameText
        ? 'LIVE · ' + participantNameText.toLocaleUpperCase('de-DE')
        : 'LIVE');
    }

    syncVhsQuestion(shell, gameMeta);
    syncVhsLegacyLabels(shell);
    syncVhsSubmittedState(shell);
    syncVhsRevealState(shell);
    syncVhsEndscreen(shell);

    var whoQuestionState = document.body.classList.contains('who-play-page')
      ? document.querySelector('#questionState')
      : null;
    var timerSource = whoQuestionState && isVhsElementVisible(whoQuestionState)
      ? document.getElementById('playerSetTimeLeft')
      : getVisibleVhsElement([
        '#questionState #playerTimeLeft',
        '#answerSubmittedState #playerTimeLeftSubmitted',
        '.game-state:not(.d-none) [data-time-left]',
        '.game-state:not(.d-none) .time-left'
      ].join(', '));
    var timer = shell.querySelector('.vhs-theme-timer');
    var timerValue = timerSource ? parseVhsTimerValue(timerSource.textContent) : null;
    var whoTimerMaximum = timerSource && timerSource.id === 'playerSetTimeLeft'
      ? parseVhsTimerValue(timerSource.dataset.vhsTimerMaximum)
      : null;
    if (timerSource && timerSource.id === 'playerSetTimeLeft' && whoTimerMaximum === null) {
      timerValue = null;
    }
    if (timer && timerValue !== null) {
      var questionKey = whoTimerMaximum !== null
        ? String(timerSource.dataset.vhsTimerKey || 'active')
        : (currentQuestionText || String(timerSource.id || 'active'));
      var timerChanged = questionKey !== vhsTimerQuestionKey;
      if (whoTimerMaximum !== null) {
        vhsTimerQuestionKey = questionKey;
        vhsTimerMaximum = Math.max(1, whoTimerMaximum);
      } else if (timerChanged || timerValue > vhsTimerMaximum) {
        vhsTimerQuestionKey = questionKey;
        vhsTimerMaximum = Math.max(1, timerValue);
      }
      var timerFill = timer.querySelector('.vhs-theme-timer-fill');
      if (whoTimerMaximum !== null && timerChanged && timerFill) {
        timerFill.style.transition = 'none';
      }
      timer.hidden = false;
      setVhsText(timer.querySelector('.vhs-theme-time'), formatVhsTimer(timerValue));
      timer.style.setProperty('--vhs-timer-progress', Math.max(0, Math.min(1, timerValue / vhsTimerMaximum)));
      if (whoTimerMaximum !== null && timerChanged && timerFill) {
        void timerFill.offsetWidth;
        timerFill.style.removeProperty('transition');
      }
    } else if (timer) {
      timer.hidden = true;
    }
  }

  function scheduleVhsSync() {
    if (vhsSyncFrame !== null || document.documentElement.dataset.participantTheme !== 'vhs') return;
    vhsSyncFrame = window.requestAnimationFrame(function () {
      vhsSyncFrame = null;
      syncVhsPresentation();
    });
  }

  function setupVhsTheme() {
    if (!vhsThemeShell) {
      var pageRoot = findVhsPageRoot();
      if (!pageRoot) return;
      vhsThemeShell = document.createElement('div');
      vhsThemeShell.className = 'vhs-theme-shell';
      pageRoot.parentNode.insertBefore(vhsThemeShell, pageRoot);
      vhsThemeShell.appendChild(pageRoot);
      createVhsThemeChrome(vhsThemeShell);
    }
    syncVhsPresentation();
    if (!vhsThemeObserver && 'MutationObserver' in window) {
      vhsThemeObserver = new MutationObserver(scheduleVhsSync);
      vhsThemeObserver.observe(vhsThemeShell, {
        attributes: true,
        attributeFilter: ['class', 'aria-expanded', 'data-participant-name', 'data-vhs-next-game-number', 'data-vhs-next-game-state', 'data-vhs-reveal-question-type', 'data-vhs-reveal-game-type'],
        characterData: true,
        childList: true,
        subtree: true
      });
    }
  }

  function applyTheme(theme) {
    var normalized = THEMES.indexOf(theme) === -1 ? DEFAULT_THEME : theme;
    var previousTheme = document.documentElement.dataset.participantTheme;
    document.documentElement.dataset.participantTheme = normalized;
    if (normalized === 'vhs') setupVhsTheme();
    else teardownVhsTheme();
    document.querySelectorAll('.qa-theme-button--action').forEach(clearActionThemeButtonState);
    syncThemeButtonGeometry(document.body);
    if (themeSelect) themeSelect.value = normalized;
    if (previousTheme && previousTheme !== normalized && window.qaParticipantWaitLoaders) {
      window.qaParticipantWaitLoaders.applyAll();
    }
    return normalized;
  }

  function saveTheme(theme) {
    setStoredValue(LS_THEME, applyTheme(theme));
    applyColorPreferences();
  }

  function readScorePosition() {
    var stored = getStoredValue(LS_SCORE_POSITION);
    return SCORE_POSITIONS.indexOf(stored) === -1 ? DEFAULT_SCORE_POSITION : stored;
  }

  function readScoreCollapsed() {
    return readStoredBoolean(LS_SCORE_COLLAPSED);
  }

  function findScoreElement() {
    var scoreElements = document.querySelectorAll('.score-box, .scorebox');
    for (var index = 0; index < scoreElements.length; index += 1) {
      if (!scoreElements[index].closest('.qa-score-widget')) return scoreElements[index];
    }
    var ownScore = document.getElementById('ownScore');
    if (!ownScore) return null;
    return ownScore.closest('.score-card, .metric');
  }

  function configureParticipantStage(scoreElement) {
    var stage = scoreElement.closest('.assign-play-layout, .who-that-play-layout, .row');
    if (!stage) return;

    var directChild = scoreElement;
    while (directChild.parentElement && directChild.parentElement !== stage) {
      directChild = directChild.parentElement;
    }
    if (directChild.parentElement !== stage) return;

    var content = Array.from(stage.children).find(function (child) {
      if (child === directChild) return false;
      return child.matches('.assign-main-column, .who-that-main-column')
        || child.querySelector('.game-state');
    });
    if (!content) return;

    stage.classList.add('qa-participant-stage');
    content.classList.add('qa-participant-stage__content');
    if (directChild !== scoreElement) {
      directChild.classList.add('qa-participant-stage__aux');
    }
  }

  function ensureScoreWidget() {
    if (scoreWidget) return scoreWidget;

    var scoreElement = findScoreElement();
    if (!scoreElement || scoreElement.closest('.qa-score-widget')) return null;

    configureParticipantStage(scoreElement);

    scoreWidget = document.createElement('aside');
    scoreWidget.className = 'qa-score-widget';
    scoreWidget.setAttribute('aria-label', 'Punkteanzeige');

    scoreWidgetButton = document.createElement('button');
    scoreWidgetButton.type = 'button';
    scoreWidgetButton.className = 'qa-score-widget__toggle';
    scoreWidgetButton.textContent = 'Punkte';
    scoreWidgetButton.setAttribute('aria-controls', 'qa-score-widget-body');

    var scoreWidgetBody = document.createElement('div');
    scoreWidgetBody.className = 'qa-score-widget__panel qa-score-widget__body';
    scoreWidgetBody.id = 'qa-score-widget-body';

    scoreElement.parentNode.insertBefore(document.createComment('Scorebox moved to floating widget'), scoreElement);
    scoreWidgetBody.appendChild(scoreElement);
    scoreWidget.appendChild(scoreWidgetButton);
    scoreWidget.appendChild(scoreWidgetBody);
    document.body.appendChild(scoreWidget);

    scoreWidgetButton.addEventListener('click', function () {
      var collapsed = !scoreWidget.classList.contains('is-collapsed');
      setStoredBoolean(LS_SCORE_COLLAPSED, collapsed);
      applyScoreWidgetCollapsed(collapsed);
    });

    applyScoreWidgetPosition(readScorePosition());
    applyScoreWidgetCollapsed(readScoreCollapsed());
    return scoreWidget;
  }

  function applyScoreWidgetPosition(position) {
    var normalized = SCORE_POSITIONS.indexOf(position) === -1 ? DEFAULT_SCORE_POSITION : position;
    if (scorePositionSelect) scorePositionSelect.value = normalized;
    if (!ensureScoreWidget()) return normalized;
    SCORE_POSITIONS.forEach(function (scorePosition) {
      scoreWidget.classList.toggle('qa-score-widget--' + scorePosition, scorePosition === normalized);
    });
    return normalized;
  }

  function saveScorePosition(position) {
    setStoredValue(LS_SCORE_POSITION, applyScoreWidgetPosition(position));
  }

  function applyScoreWidgetCollapsed(collapsed) {
    if (!ensureScoreWidget()) return;
    scoreWidget.classList.toggle('is-collapsed', collapsed);
    if (scoreWidgetButton) {
      scoreWidgetButton.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    }
    var scoreWidgetBody = scoreWidget.querySelector('.qa-score-widget__body');
    if (scoreWidgetBody) scoreWidgetBody.setAttribute('aria-hidden', collapsed ? 'true' : 'false');
    if (document.documentElement.dataset.participantTheme === 'vhs') scheduleVhsSync();
  }

  function observeScoreWidgetTarget() {
    if (ensureScoreWidget() || !('MutationObserver' in window)) return;
    var observer = new MutationObserver(function () {
      if (ensureScoreWidget()) observer.disconnect();
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  function ensureThemeButtonLabel(button) {
    if (button.querySelector(':scope > .qa-theme-button__label')) return;
    var textNodes = Array.from(button.childNodes).filter(function (node) {
      return node.nodeType === Node.TEXT_NODE && node.textContent.trim();
    });
    if (!textNodes.length) return;

    var label = document.createElement('span');
    label.className = 'qa-theme-button__label';
    button.insertBefore(label, textNodes[0]);
    textNodes.forEach(function (node) {
      label.appendChild(node);
    });
  }

  function isThemeButtonCandidate(button) {
    if (!button || button.nodeType !== 1 || !button.matches(themeButtonSelector)) return false;
    if (button.closest(themeButtonExcludedSelector)) return false;
    return !button.matches('[draggable="true"], [aria-grabbed="true"], .is-dragging');
  }

  function isSelectableThemeAnswer(button) {
    return button.matches('.answer-option, [data-qa-answer-selectable]');
  }

  function clearActionThemeButtonState(button) {
    var timer = actionThemeClickTimers.get(button);
    if (timer) window.clearTimeout(timer);
    actionThemeClickTimers.delete(button);
    button.classList.remove('is-theme-clicked', 'is-selected');
    button.removeAttribute('aria-pressed');
  }

  function playActionThemeClick(button) {
    if (document.documentElement.dataset.participantTheme !== 'standard') {
      clearActionThemeButtonState(button);
      return;
    }

    var timer = actionThemeClickTimers.get(button);
    if (timer) window.clearTimeout(timer);
    if (button.classList.contains('is-theme-clicked')) {
      clearActionThemeButtonState(button);
      return;
    }

    button.classList.add('is-theme-clicked');
    actionThemeClickTimers.set(button, window.setTimeout(function () {
      button.classList.remove('is-theme-clicked');
      actionThemeClickTimers.delete(button);
    }, 750));
  }

  function enhanceThemeButton(button) {
    if (!isThemeButtonCandidate(button)) return;
    var wasEnhanced = button.classList.contains('qa-theme-button');
    var isAnswerButton = isSelectableThemeAnswer(button);
    var buttonRadius = window.getComputedStyle(button).borderRadius;
    button.classList.add('qa-theme-button');
    button.classList.toggle('qa-theme-button--answer', isAnswerButton);
    button.classList.toggle('qa-theme-button--action', !isAnswerButton);
    if (!isAnswerButton && !wasEnhanced) clearActionThemeButtonState(button);
    ensureThemeButtonLabel(button);
    if (button.parentElement && button.parentElement.classList.contains('qa-theme-button-shell')) return;

    var shell = document.createElement(button.tagName === 'BUTTON' ? 'span' : 'div');
    shell.className = 'qa-theme-button-shell';
    shell.style.setProperty('--qa-theme-button-radius', buttonRadius);
    if (button.matches('.answer-option') || (button.classList.contains('w-100') && !button.matches('.submit-answer, #logRoundBtn, #submitBtn, #submitRoundBtn'))) {
      shell.classList.add('qa-theme-button-shell--block');
    }
    if (button.matches('.submit-answer, #logRoundBtn, #submitBtn, #submitRoundBtn')) {
      shell.classList.add('qa-theme-button-shell--centered');
    }
    button.parentNode.insertBefore(shell, button);
    shell.appendChild(button);
  }

  function syncThemeButtonGeometry(rootNode) {
    if (!rootNode) return;
    rootNode.querySelectorAll('.qa-theme-button').forEach(function (button) {
      var shell = button.parentElement;
      if (!shell || !shell.classList.contains('qa-theme-button-shell')) return;
      shell.style.setProperty('--qa-theme-button-radius', window.getComputedStyle(button).borderRadius);
    });
  }

  function enhanceThemeButtons(rootNode) {
    if (!rootNode || rootNode.nodeType !== 1) return;
    enhanceThemeButton(rootNode);
    rootNode.querySelectorAll(themeButtonSelector).forEach(enhanceThemeButton);
  }

  function observeThemeButtons() {
    enhanceThemeButtons(document.body);
    if (!('MutationObserver' in window)) return;
    new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        enhanceThemeButton(mutation.target);
        mutation.addedNodes.forEach(enhanceThemeButtons);
      });
    }).observe(document.body, { childList: true, subtree: true });
  }

  function readColorPreferences() {
    return {
      customColorsEnabled: readStoredBoolean(LS_CUSTOM_COLORS_ENABLED),
      backgroundColor: normalizeHexColor(getStoredValue(LS_BACKGROUND_COLOR), DEFAULT_BACKGROUND_COLOR),
      textColor: normalizeHexColor(getStoredValue(LS_TEXT_COLOR), DEFAULT_TEXT_COLOR),
      accentColor: normalizeHexColor(getStoredValue(LS_ACCENT_COLOR), DEFAULT_ACCENT_COLOR),
      accentColor2: normalizeHexColor(getStoredValue(LS_ACCENT_COLOR_2), DEFAULT_ACCENT_COLOR_2),
      highContrast: readStoredBoolean(LS_HIGH_CONTRAST),
      invertColors: readStoredBoolean(LS_INVERT_COLORS),
    };
  }

  function setColorInputsEnabled(enabled) {
    backgroundColorInput.disabled = !enabled;
    textColorInput.disabled = !enabled;
    accentColorInput.disabled = !enabled;
    accentColor2Input.disabled = !enabled;
    backgroundColorInput.closest('.participant-color-field').classList.toggle('is-disabled', !enabled);
    textColorInput.closest('.participant-color-field').classList.toggle('is-disabled', !enabled);
    accentColorInput.closest('.participant-color-field').classList.toggle('is-disabled', !enabled);
    accentColor2Input.closest('.participant-color-field').classList.toggle('is-disabled', !enabled);
  }

  function clearAppliedColorVariables() {
    [
      '--participant-bg-color',
      '--participant-text-color',
      '--participant-accent-color',
      '--participant-accent-color-2',
      '--participant-effective-bg-color',
      '--participant-effective-text-color',
      '--participant-effective-accent-color',
      '--participant-effective-accent-color-2'
    ].forEach(function (variableName) {
      document.documentElement.style.removeProperty(variableName);
    });
  }

  function applyColorPreferences() {
    var preferences = readColorPreferences();
    clearAppliedColorVariables();
    var backgroundColor = getThemeColor('--participant-theme-background', DEFAULT_BACKGROUND_COLOR);
    var textColor = getThemeColor('--participant-theme-text', DEFAULT_TEXT_COLOR);
    var accentColor = getThemeColor('--participant-accent-color', DEFAULT_ACCENT_COLOR);
    var accentColor2 = getThemeColor('--participant-accent-color-2', DEFAULT_ACCENT_COLOR_2);

    customColorsToggle.checked = preferences.customColorsEnabled;
    backgroundColorInput.value = preferences.backgroundColor;
    textColorInput.value = preferences.textColor;
    accentColorInput.value = preferences.accentColor;
    accentColor2Input.value = preferences.accentColor2;
    highContrastToggle.checked = preferences.highContrast;
    invertColorsToggle.checked = preferences.invertColors;
    setColorInputsEnabled(preferences.customColorsEnabled);

    if (preferences.customColorsEnabled) {
      backgroundColor = preferences.backgroundColor;
      textColor = preferences.textColor;
      accentColor = preferences.accentColor;
      accentColor2 = preferences.accentColor2;
      document.documentElement.style.setProperty('--participant-bg-color', preferences.backgroundColor);
      document.documentElement.style.setProperty('--participant-text-color', preferences.textColor);
      document.documentElement.style.setProperty('--participant-accent-color', preferences.accentColor);
      document.documentElement.style.setProperty('--participant-accent-color-2', preferences.accentColor2);
    }
    if (preferences.highContrast) {
      backgroundColor = '#ffffff';
      textColor = '#000000';
      accentColor = backgroundColor;
      accentColor2 = textColor;
    }
    if (preferences.invertColors) {
      backgroundColor = invertHexColor(backgroundColor);
      textColor = invertHexColor(textColor);
      accentColor = invertHexColor(accentColor);
      accentColor2 = invertHexColor(accentColor2);
    }

    var colorsApplied = (
      preferences.customColorsEnabled || preferences.highContrast || preferences.invertColors
    );
    if (colorsApplied) {
      document.documentElement.style.setProperty('--participant-effective-bg-color', backgroundColor);
      document.documentElement.style.setProperty('--participant-effective-text-color', textColor);
      document.documentElement.style.setProperty('--participant-effective-accent-color', accentColor);
      document.documentElement.style.setProperty('--participant-effective-accent-color-2', accentColor2);
    }
    document.documentElement.dataset.participantColorsApplied = colorsApplied ? 'true' : 'false';
    document.documentElement.dataset.participantHighContrast = preferences.highContrast ? 'true' : 'false';
  }

  function resetInterfaceOptions() {
    removeStoredValue(LS_FONT_SCALE);
    removeStoredValue(LS_THEME);
    removeStoredValue(LS_SCORE_POSITION);
    removeStoredValue(LS_SCORE_COLLAPSED);
    removeStoredValue(LS_CUSTOM_COLORS_ENABLED);
    removeStoredValue(LS_BACKGROUND_COLOR);
    removeStoredValue(LS_TEXT_COLOR);
    removeStoredValue(LS_ACCENT_COLOR);
    removeStoredValue(LS_ACCENT_COLOR_2);
    removeStoredValue(LS_HIGH_CONTRAST);
    removeStoredValue(LS_INVERT_COLORS);
    applyFontScale(DEFAULT_FONT_SCALE);
    applyTheme(DEFAULT_THEME);
    applyScoreWidgetPosition(DEFAULT_SCORE_POSITION);
    applyScoreWidgetCollapsed(false);
    applyColorPreferences();
  }

  function setOpen(open) {
    root.classList.toggle('is-open', open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (!open) setInterfacePanelOpen(false);
  }

  function setInterfacePanelOpen(open) {
    if (!interfacePanel || !interfaceButton) return;
    interfacePanel.hidden = !open;
    interfaceButton.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  toggle.addEventListener('click', function () {
    setOpen(!root.classList.contains('is-open'));
  });

  closeButton.addEventListener('click', function () {
    setOpen(false);
    toggle.focus();
  });

  interfaceButton.addEventListener('click', function () {
    setInterfacePanelOpen(interfacePanel.hidden);
  });

  fontDecrease.addEventListener('click', function () {
    saveFontScale(readFontScale() - FONT_SCALE_STEP);
  });

  fontIncrease.addEventListener('click', function () {
    saveFontScale(readFontScale() + FONT_SCALE_STEP);
  });

  themeSelect.addEventListener('change', function () {
    saveTheme(themeSelect.value);
  });

  scorePositionSelect.addEventListener('change', function () {
    saveScorePosition(scorePositionSelect.value);
  });

  customColorsToggle.addEventListener('change', function () {
    setStoredBoolean(LS_CUSTOM_COLORS_ENABLED, customColorsToggle.checked);
    applyColorPreferences();
  });

  backgroundColorInput.addEventListener('input', function () {
    if (backgroundColorInput.disabled) return;
    setStoredValue(LS_BACKGROUND_COLOR, normalizeHexColor(backgroundColorInput.value, DEFAULT_BACKGROUND_COLOR));
    applyColorPreferences();
  });

  textColorInput.addEventListener('input', function () {
    if (textColorInput.disabled) return;
    setStoredValue(LS_TEXT_COLOR, normalizeHexColor(textColorInput.value, DEFAULT_TEXT_COLOR));
    applyColorPreferences();
  });

  accentColorInput.addEventListener('input', function () {
    if (accentColorInput.disabled) return;
    setStoredValue(LS_ACCENT_COLOR, normalizeHexColor(accentColorInput.value, DEFAULT_ACCENT_COLOR));
    applyColorPreferences();
  });

  accentColor2Input.addEventListener('input', function () {
    if (accentColor2Input.disabled) return;
    setStoredValue(LS_ACCENT_COLOR_2, normalizeHexColor(accentColor2Input.value, DEFAULT_ACCENT_COLOR_2));
    applyColorPreferences();
  });

  highContrastToggle.addEventListener('change', function () {
    setStoredBoolean(LS_HIGH_CONTRAST, highContrastToggle.checked);
    applyColorPreferences();
  });

  invertColorsToggle.addEventListener('change', function () {
    setStoredBoolean(LS_INVERT_COLORS, invertColorsToggle.checked);
    applyColorPreferences();
  });

  resetButton.addEventListener('click', resetInterfaceOptions);

  document.addEventListener('click', function (event) {
    var themeButton = event.target.closest && event.target.closest('.qa-theme-button');
    if (
      themeButton
      && !themeButton.disabled
      && themeButton.getAttribute('aria-disabled') !== 'true'
      && !themeButton.classList.contains('disabled')
      && themeButton.classList.contains('qa-theme-button--action')
    ) {
      playActionThemeClick(themeButton);
    }
    if (!root.classList.contains('is-open')) return;
    if (root.contains(event.target)) return;
    setOpen(false);
  }, true);

  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Escape') return;
    if (!root.classList.contains('is-open')) return;
    setOpen(false);
    toggle.focus();
  });

  applyFontScale(readFontScale());
  applyTheme(readTheme());
  applyScoreWidgetPosition(readScorePosition());
  applyScoreWidgetCollapsed(readScoreCollapsed());
  observeScoreWidgetTarget();
  observeThemeButtons();
  applyColorPreferences();
}());
</script>
{% else %}

<div id="a11y-bar" role="toolbar" aria-label="Barrierefreiheit">
  <button id="a11y-font-down" title="Schrift kleiner" aria-label="Schriftgröße verringern">A−</button>
  <button id="a11y-font-up"   title="Schrift größer"  aria-label="Schriftgröße vergrößern">A+</button>
  <div class="a11y-sep" role="separator"></div>
  <button id="a11y-contrast-btn" title="Hoher Kontrast umschalten" aria-label="Hoher Kontrast umschalten" aria-pressed="false">◐</button>
</div>

<script>
(function () {
  var LS_SIZE     = 'a11y_font_size';
  var LS_CONTRAST = 'a11y_high_contrast';
  var MIN = 80, MAX = 150, STEP = 10;

  function getSize() {
    return parseInt(localStorage.getItem(LS_SIZE) || '100', 10);
  }
  function applySize(size) {
    document.documentElement.style.fontSize = size + '%';
  }

  function getContrast() {
    return localStorage.getItem(LS_CONTRAST) === '1';
  }
  function applyContrast(on) {
    document.documentElement.classList.toggle('hc', on);
    var btn = document.getElementById('a11y-contrast-btn');
    if (!btn) return;
    btn.classList.toggle('a11y-on', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  // Apply persisted settings immediately
  applySize(getSize());
  applyContrast(getContrast());

  document.getElementById('a11y-font-down').addEventListener('click', function () {
    var s = Math.max(MIN, getSize() - STEP);
    localStorage.setItem(LS_SIZE, s);
    applySize(s);
  });
  document.getElementById('a11y-font-up').addEventListener('click', function () {
    var s = Math.min(MAX, getSize() + STEP);
    localStorage.setItem(LS_SIZE, s);
    applySize(s);
  });
  document.getElementById('a11y-contrast-btn').addEventListener('click', function () {
    var on = !getContrast();
    localStorage.setItem(LS_CONTRAST, on ? '1' : '0');
    applyContrast(on);
  });
}());
</script>
{% endif %}
